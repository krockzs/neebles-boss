[package]
name = "neebles-backend"
version = "1.0.16"
edition = "2021"
authors = ["Olate Stark and Jarvis"]
description = "N.E.E.B.L.E.S. Boss backend"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = "0.10"
semver = "1"
zbus = "5"
ureq = "3.4.2"
sha2 = "0.11.0"
walkdir = "2.5.0"
zip = "8.6.0"
tar = "0.4.46"
flate2 = "1.1.10"
xz2 = "0.1.7"
zstd = "0.14.0"
argon2 = "0.6.0"
bcrypt = "0.19.3"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
fs4 = "1.1.0"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
regex = "1.13.1"
globset = "0.4.20"
tempfile = "3.27.0"
url = "2.5.8"
base64 = "0.23.1"
uuid = { version = "1.26.1", features = ["v4"] }
async-process = "2.5.0"
async-io = "2.6.0"
async-executor = "1.14.0"
async-lock = "3.4.2"
async-channel = "2.5.0"
async-broadcast = "0.7.2"
async-signal = "0.2.14"
futures-lite = "2.6.1"
futures-util = "0.3.34"

[[test]]
name = "domesticacion_elfica"
path = "testings/domesticacion/rust/domesticacion.rs"
