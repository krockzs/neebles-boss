name: Build and release NEEBLES Boss 0.0.1

on:
  push:
    paths:
      - "release/trigger-v0.0.1"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            curl \
            build-essential \
            cmake \
            rustc \
            cargo \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Rust backend
        run: cargo build --release

      - name: Build client UI
        run: |
          cmake -S ui/client -B ui/client/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ui/client/build --parallel

      - name: Build installer UI
        run: |
          cmake -S ui/installer -B ui/installer/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ui/installer/build --parallel

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp target/release/neebles-backend dist/neebles-backend
          cp ui/client/build/neebles-ui dist/neebles-ui
          cp ui/installer/build/neebles-installer dist/neebles-installer
          cp scripts/install.sh dist/install.sh
          cp bootstrap/neebles-entrypoint dist/neebles-entrypoint
          chmod +x dist/*
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Publish v0.0.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          target_commitish: main
          name: N.E.E.B.L.E.S. Boss v0.0.1
          body: |
            First functional N.E.E.B.L.E.S. Boss bootstrap milestone.

            Includes the Rust Boss backend, normal Qt client UI, graphical Qt installer, privileged install script and bootstrap entrypoint.
          files: |
            dist/neebles-backend
            dist/neebles-ui
            dist/neebles-installer
            dist/install.sh
            dist/neebles-entrypoint
            dist/SHA256SUMS
