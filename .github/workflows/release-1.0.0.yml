name: Build and release NEEBLES Boss 1.0.0

on:
  push:
    paths:
      - "release/trigger-v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            curl \
            build-essential \
            cmake \
            rustc \
            cargo \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Rust backend
        run: cargo build --release

      - name: Build client UI
        run: |
          cmake -S ui/client -B ui/client/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ui/client/build --parallel

      - name: Build installer UI
        run: |
          cmake -S ui/installer -B ui/installer/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ui/installer/build --parallel

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/neebles-backend dist/neebles-backend
          cp ui/client/build/neebles-ui dist/neebles-ui
          cp ui/installer/build/neebles-installer dist/neebles-installer
          cp scripts/install.sh dist/install.sh
          chmod +x dist/neebles-backend dist/neebles-ui dist/neebles-installer dist/install.sh

          BACKEND_SHA="$(sha256sum dist/neebles-backend | awk '{print $1}')"
          UI_SHA="$(sha256sum dist/neebles-ui | awk '{print $1}')"
          INSTALLER_SHA="$(sha256sum dist/neebles-installer | awk '{print $1}')"
          INSTALL_SHA="$(sha256sum dist/install.sh | awk '{print $1}')"

          cat > dist/bootstrap.json <<EOF
          {
            "schema": 2,
            "channel": "stable",
            "stable": {
              "version": "1.0.0",
              "base_url": "https://github.com/krockzs/neebles-boss/releases/download/v1.0.0",
              "assets": {
                "backend": {
                  "file": "neebles-backend",
                  "sha256": "${BACKEND_SHA}"
                },
                "ui": {
                  "file": "neebles-ui",
                  "sha256": "${UI_SHA}"
                },
                "installer": {
                  "file": "neebles-installer",
                  "sha256": "${INSTALLER_SHA}"
                },
                "install": {
                  "file": "install.sh",
                  "sha256": "${INSTALL_SHA}"
                }
              }
            }
          }
          EOF

          sha256sum \
            dist/neebles-backend \
            dist/neebles-ui \
            dist/neebles-installer \
            dist/install.sh \
            dist/bootstrap.json \
            | tee dist/SHA256SUMS

      - name: Publish v1.0.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: N.E.E.B.L.E.S. Boss v1.0.0
          body: |
            N.E.E.B.L.E.S. Boss 1.0.0 stable bootstrap milestone.

            Publishes the Rust Boss backend, Qt client UI, graphical Qt installer,
            privileged install script and Bootstrap Schema 2 manifest.
          files: |
            dist/neebles-backend
            dist/neebles-ui
            dist/neebles-installer
            dist/install.sh
            dist/bootstrap.json
            dist/SHA256SUMS
