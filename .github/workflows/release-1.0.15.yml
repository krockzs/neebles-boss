name: Build and release NEEBLES Boss 1.0.15

on:
  push:
    paths:
      - "release/trigger-v1.0.15"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie-slim

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            git-lfs \
            curl \
            build-essential \
            cmake \
            pkg-config \
            libgl1-mesa-dev \
            liblayershellqtinterface-dev \
            libpolkit-qt6-1-dev \
            gpg \
            python3 \
            patchelf \
            binutils \
            musl-tools \
            tar \
            gzip

          mkdir -p /etc/apt/keyrings

          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | dd of=/etc/apt/keyrings/githubcli-archive-keyring.gpg

          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg

          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gh

          git lfs version
          gh --version
          patchelf --version
          readelf --version | head -n 1

      - name: Install Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.98.1

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Checkout Boss
        uses: actions/checkout@v4

      - name: Checkout controlled Qt 6.8.2 snapshot
        uses: actions/checkout@v4
        with:
          repository: krockzs/neebles-calamares
          ref: neebles-v3.3.14
          path: neebles-calamares

      - name: Checkout certified CUSTOM Boss runtime
        uses: actions/checkout@v4
        with:
          repository: krockzs/neebles-custom
          ref: 1efc6cb304d8e7d739849c266a1d33cc1e92dc54
          path: neebles-custom
          lfs: true
          sparse-checkout: |
            runtime/boss/rootfs
            runtime/manifests/boss.rootfs.tsv
          sparse-checkout-cone-mode: false

      - name: Verify controlled Qt snapshot
        shell: bash
        run: |
          test -d neebles-calamares/qt_6.8.2
          test -f neebles-calamares/qt_6.8.2/SHA256SUMS

          COUNT="$(find neebles-calamares/qt_6.8.2 -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$COUNT" -eq 115

          cd neebles-calamares/qt_6.8.2
          sha256sum -c SHA256SUMS

      - name: Install controlled Qt 6.8.2
        shell: bash
        run: |
          cd neebles-calamares/qt_6.8.2
          apt-get install -y ./*.deb
          qmake6 --version

      - name: Resolve Qt6 CMake package
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; import os; matches=sorted(Path("/usr").rglob("Qt6Config.cmake")); len(matches)==1 or (_ for _ in ()).throw(RuntimeError("expected exactly one Qt6Config.cmake, found "+str(len(matches)))); open(os.environ["GITHUB_ENV"],"a",encoding="utf-8").write("Qt6_DIR="+str(matches[0].parent)+"\n"); print(matches[0].parent)'

      - name: Verify certified CUSTOM runtime inputs
        shell: bash
        run: |
          test -d neebles-custom/runtime/boss/rootfs
          test -s neebles-custom/runtime/manifests/boss.rootfs.tsv
          test -s neebles-custom/runtime/boss/rootfs/usr/lib/x86_64-linux-gnu/libLLVM.so.19.1
          git -C neebles-custom lfs ls-files

      - name: Build Rust release binaries
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --locked --bins

      - name: Build static bootstrap runtime resolver
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build \
            --release \
            --locked \
            --bin neebles-runtime-resolve \
            --target x86_64-unknown-linux-musl

          readelf -l target/x86_64-unknown-linux-musl/release/neebles-runtime-resolve
          readelf -d target/x86_64-unknown-linux-musl/release/neebles-runtime-resolve

      - name: Build Boss UI
        shell: bash
        run: |
          cmake \
            -S ui/client \
            -B ui/client/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR="$Qt6_DIR"

          cmake --build ui/client/build --parallel

      - name: Build installer UI
        shell: bash
        run: |
          cmake \
            -S ui/installer \
            -B ui/installer/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR="$Qt6_DIR"

          cmake --build ui/installer/build --parallel

      - name: Build authorization agent
        shell: bash
        run: |
          cmake \
            -S ui/auth-agent \
            -B ui/auth-agent/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR="$Qt6_DIR"

          cmake --build ui/auth-agent/build --parallel

      - name: Build Plasma launcher plugin
        shell: bash
        run: |
          cmake \
            -S client/launcher-plugin \
            -B client/launcher-plugin/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR="$Qt6_DIR"

          cmake --build client/launcher-plugin/build --parallel

      - name: Build Qt tray host
        shell: bash
        run: |
          cmake \
            -S client/tray-host \
            -B client/tray-host/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR="$Qt6_DIR"

          cmake --build client/tray-host/build --parallel

      - name: Materialize domestic Boss runtime manifest
        shell: bash
        run: |
          mkdir -p release-work

          target/release/neebles-domestic-materialize \
            --contract src/contracts/domesticacion-elfica.schema.json \
            --grimoire src/contracts/domesticacion-elfica.grimorio.json \
            --targets src/contracts/domesticacion-elfica.targets.json \
            --root neebles-custom/runtime/boss/rootfs \
            --output release-work/domestic-runtime.json

      - name: Package and certify domestic Boss runtime
        shell: bash
        run: |
          python3 scripts/package-domestic-runtime.py \
            --root neebles-custom/runtime/boss/rootfs \
            --manifest release-work/domestic-runtime.json \
            --output release-work/boss-runtime.tar.gz \
            --report release-work/boss-runtime-report.txt \
            --transport-tool target/release/neebles-domestic-transport \
            --source-manifest neebles-custom/runtime/manifests/boss.rootfs.tsv

          grep -F "GREEN :: BOSS RUNTIME TRANSPORT CERTIFIED" \
            release-work/boss-runtime-report.txt

      - name: Materialize 1.0.15 release payload
        shell: bash
        run: |
          rm -rf dist

          python3 scripts/materialize-release.py \
            --dist dist \
            --backend target/release/neebles-backend \
            --ui ui/client/build/neebles-ui \
            --installer ui/installer/build/neebles-installer \
            --auth-agent ui/auth-agent/build/neebles-auth-agent \
            --tray-host client/tray-host/build/neebles-tray-host \
            --launcher-plugin-build client/launcher-plugin/build \
            --client-source client \
            --runtime-resolver target/x86_64-unknown-linux-musl/release/neebles-runtime-resolve \
            --runtime-archive release-work/boss-runtime.tar.gz

      - name: Verify 1.0.15 release payload
        shell: bash
        run: |
          python3 scripts/verify-release.py \
            --dist dist \
            --cargo-toml Cargo.toml

          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 11

          python3 -c 'from pathlib import Path; expected={"neebles-backend","neebles-ui","neebles-installer","neebles-auth-agent","client-data.tar.gz","install.sh","neebles-runtime-resolve","boss-runtime.tar.gz","critical-update-manifest.json","bootstrap.json","SHA256SUMS"}; actual={p.name for p in Path("dist").iterdir() if p.is_file()}; actual==expected or (_ for _ in ()).throw(RuntimeError("dist asset mismatch: "+repr(sorted(actual))))'

      - name: Publish v1.0.15 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh --version

          if gh release view v1.0.15 >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view v1.0.15 --json isDraft --jq ".isDraft")"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "ERROR: v1.0.15 already exists as a published release; refusing to mutate it."
              exit 1
            fi

            gh release edit v1.0.15 \
              --draft \
              --title "N.E.E.B.L.E.S. Boss v1.0.15" \
              --notes-file release/notes-v1.0.15.md \
              --target "${GITHUB_SHA}"

            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset v1.0.15 "$asset" --yes
            done < <(
              gh release view v1.0.15 \
                --json assets \
                --jq '.assets[].name'
            )
          else
            gh release create v1.0.15 \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "N.E.E.B.L.E.S. Boss v1.0.15" \
              --notes-file release/notes-v1.0.15.md
          fi

          for asset in \
            dist/neebles-backend \
            dist/neebles-ui \
            dist/neebles-installer \
            dist/neebles-auth-agent \
            dist/client-data.tar.gz \
            dist/install.sh \
            dist/neebles-runtime-resolve \
            dist/boss-runtime.tar.gz \
            dist/critical-update-manifest.json \
            dist/bootstrap.json \
            dist/SHA256SUMS
          do
            uploaded=false

            for attempt in 1 2 3 4 5; do
              echo "Uploading $asset - attempt $attempt/5"

              if gh release upload v1.0.15 "$asset"; then
                uploaded=true
                break
              fi

              if [ "$attempt" -lt 5 ]; then
                sleep 15
              fi
            done

            if [ "$uploaded" != true ]; then
              echo "ERROR: failed to upload $asset after 5 attempts."
              exit 1
            fi
          done

          gh release view v1.0.15 \
            --json assets \
            --jq '.assets[].name' \
            | sort > /tmp/neebles-remote-assets.txt

          printf '%s\n' \
            SHA256SUMS \
            bootstrap.json \
            boss-runtime.tar.gz \
            client-data.tar.gz \
            critical-update-manifest.json \
            install.sh \
            neebles-auth-agent \
            neebles-backend \
            neebles-installer \
            neebles-runtime-resolve \
            neebles-ui \
            | sort > /tmp/neebles-expected-assets.txt

          diff -u \
            /tmp/neebles-expected-assets.txt \
            /tmp/neebles-remote-assets.txt

          gh release edit v1.0.15 --draft=false --latest
