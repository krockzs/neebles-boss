name: Check NEEBLES Boss

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check --locked
      - name: Audit remote AMD64 installer dictionary
        run: |
          cargo run --locked -- --request-json '{
            "target":"boss",
            "action":"local-installer-audit",
            "args":[],
            "context":{"caller":"ci"}
          }'
