name: Check NEEBLES Boss

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "client/**"
      - "ui/**"
      - "scripts/**"
      - "registry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/check.yml"

  pull_request:
    paths:
      - "src/**"
      - "client/**"
      - "ui/**"
      - "scripts/**"
      - "registry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie-slim

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            curl \
            build-essential \
            cmake \
            pkg-config \
            python3 \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev \
            liblayershellqtinterface-dev \
            libpolkit-qt6-1-dev

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.98.1 --component rustfmt

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustfmt" --version

      - uses: actions/checkout@v4

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --locked

      - name: Rust check
        run: cargo check --locked

      - name: Validate Boss language contract
        run: ./scripts/validate-languages.py

      - name: Build all Boss components
        run: ./scripts/build-all.sh

      - name: Validate packaging install contract
        run: ./scripts/test-install-layout.sh

      - name: Audit remote AMD64 installer dictionary
        run: |
          cargo run --locked -- --request-json '{
            "target":"boss",
            "action":"local-installer-audit",
            "args":[],
            "context":{"caller":"ci"}
          }'
